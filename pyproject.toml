[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mpd218-streamdeck"
version = "0.1.0"
description = "Config-driven Akai MPD218 macro controller"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mido",
    "python-rtmidi",
    "psutil",
    "numpy",
    "faster-whisper",
    "sounddevice",
    "soundfile",
    "pyperclip; platform_system == 'Windows'",
    "pyautogui; platform_system == 'Windows'",
    "pywinauto>=0.6.8; platform_system == 'Windows'",
    "pywin32; platform_system == 'Windows'",
]

[project.scripts]
mpd218_streamdeck = "controller:main"

[tool.setuptools]
py-modules = ["controller"]

[tool.setuptools.packages.find]
include = ["core*"]
